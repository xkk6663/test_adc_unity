# ==============================================================================
# GitHub Actions CI/CD 流水线
# ==============================================================================
# 触发条件：
#   - push 到 main / master 分支
#   - 向 main / master 分支发起 Pull Request
#
# 流水线覆盖：
#   1. 环境准备（gcc / make / cmake / ruby）
#   2. CMock 重新生成桩文件（验证桩生成流程可用）
#   3. Makefile 构建 + 单元测试
#   4. 固件模拟运行
#   5. CMake 构建 + CTest
# ==============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------
      # 1. 检出代码
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. 安装依赖
      #    ubuntu-latest 通常预装了 gcc/make/cmake/ruby，显式安装确保齐全
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cmake ruby

      # ------------------------------------------------------------------
      # 3. 打印工具版本（便于排查问题）
      # ------------------------------------------------------------------
      - name: Show tool versions
        run: |
          echo "=== gcc ===" && gcc --version
          echo "=== make ===" && make --version
          echo "=== cmake ===" && cmake --version
          echo "=== ruby ===" && ruby --version

      # ------------------------------------------------------------------
      # 4. 用 CMock 重新生成桩文件
      #    验证 hal_adc.h → mock_hal_adc.c/.h 的自动生成流程
      #    生成的桩会覆盖仓库中预生成的版本
      # ------------------------------------------------------------------
      - name: Regenerate mocks with CMock
        run: ruby gen_mocks.rb

      # ------------------------------------------------------------------
      # 5. Makefile 构建（双目标：unit_test + firmware_demo）
      # ------------------------------------------------------------------
      - name: Build with Makefile
        run: make all

      # ------------------------------------------------------------------
      # 6. 运行单元测试（Makefile 构建的 unit_test）
      # ------------------------------------------------------------------
      - name: Run unit tests (Makefile)
        run: ./unit_test

      # ------------------------------------------------------------------
      # 7. 运行固件模拟（验证双目标编译的固件目标可正常运行）
      # ------------------------------------------------------------------
      - name: Run firmware demo
        run: ./firmware_demo

      # ------------------------------------------------------------------
      # 8. CMake 构建（验证 CMakeLists.txt 可用）
      # ------------------------------------------------------------------
      - name: Build with CMake
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

      # ------------------------------------------------------------------
      # 9. 运行 CTest（CMake 集成的测试）
      # ------------------------------------------------------------------
      - name: Run unit tests (CTest)
        run: |
          cd build
          ctest --output-on-failure
