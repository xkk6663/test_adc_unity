# ==============================================================================
# 产品级 CI/CD 流水线（纯 CMake 构建，仿照 ELAB 框架工程实践）
# ==============================================================================
# 触发：push / PR 到 main 或 master 分支
#
# 三 Job 流水线：
#   1. static-analysis —— cppcheck 静态代码检查
#   2. build-and-test  —— 三平台矩阵（Ubuntu/gcc + macOS/clang + Windows/MSVC）
#   3. coverage         —— gcov/lcov 测试覆盖率报告
# ==============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================================
  # Job 1: 静态代码分析（cppcheck）
  # ============================================================================
  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   --error-exitcode=1 \
                   -I app/battery -I app/led -I hal \
                   app/ hal/ platform/

  # ============================================================================
  # Job 2: 多平台构建与测试矩阵（纯 CMake）
  # ============================================================================
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: static-analysis
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            generator: "Unix Makefiles"
          - os: macos-latest
            cc: clang
            generator: "Unix Makefiles"
          - os: windows-latest
            cc: msvc
            generator: "Ninja"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # 安装依赖
      - name: Install CMake (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y cmake ruby

      - name: Install CMake (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake ruby

      - name: Setup Ruby (Windows)
        if: matrix.os == 'windows-latest'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Setup MSVC environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # 工具版本
      - name: Show tool versions
        shell: bash
        run: |
          echo "=== OS ===" && uname -a 2>/dev/null || ver
          echo "=== cmake ===" && cmake --version
          echo "=== ruby ===" && ruby --version

      # CMock 重新生成桩（验证桩生成流程）
      - name: Regenerate mocks with CMock
        run: ruby tools/gen_mocks.rb

      # CMake 配置 + 构建
      - name: Configure with CMake
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # 运行单元测试（CTest）
      - name: Run unit tests (CTest)
        run: ctest --test-dir build --output-on-failure -C Release

      # 运行固件模拟
      - name: Run firmware demo
        shell: bash
        run: |
          if [ -f build/firmware_demo ]; then
            timeout 5 ./build/firmware_demo || true
          elif [ -f build/Release/firmware_demo.exe ]; then
            ./build/Release/firmware_demo.exe || true
          elif [ -f build/firmware_demo.exe ]; then
            ./build/firmware_demo.exe || true
          fi

      # 上传构建产物
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            build/unit_test
            build/unit_test.exe
            build/firmware_demo
            build/firmware_demo.exe
            build/Release/unit_test.exe
            build/Release/firmware_demo.exe
          if-no-files-found: ignore

  # ============================================================================
  # Job 3: 测试覆盖率（gcov/lcov，仅 Ubuntu）
  # ============================================================================
  coverage:
    name: Test Coverage (gcov/lcov)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ruby lcov

      - name: Regenerate mocks
        run: ruby tools/gen_mocks.rb

      - name: Configure with coverage flags
        run: cmake -S . -B build -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info \
               --rc branch_coverage=1
          lcov --remove coverage.info \
               '/usr/*' 'framework/*' 'test/*' 'tools/*' \
               --output-file coverage-filtered.info \
               --rc branch_coverage=1 \
               --ignore-errors unused
          genhtml coverage-filtered.info \
                  --output-directory coverage-report \
                  --branch-coverage --legend --title "Unit Test Coverage"

      - name: Print coverage summary
        run: lcov --summary coverage-filtered.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
