# ==============================================================================
# 产品级 CI/CD 流水线（仿照 ELAB 框架工程实践）
# ==============================================================================
# 触发条件：
#   - push 到 main / master 分支
#   - 向 main / master 分支发起 Pull Request
#
# 流水线分为三个 Job：
#   1. static-analysis —— 静态代码检查（cppcheck）
#   2. build-and-test  —— 多平台构建矩阵（Ubuntu/gcc + macOS/clang + Windows/MSVC）
#   3. coverage         —— 测试覆盖率（gcov + lcov，仅 Ubuntu）
#
# 每个平台验证：
#   - CMock 桩自动生成（验证 hal → mock 流程）
#   - Makefile 构建（Ubuntu/macOS）或 CMake 构建（全平台）
#   - 单元测试运行（19 个用例）
#   - 固件模拟运行
# ==============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# ==============================================================================
# Job 1: 静态代码分析
# ==============================================================================
jobs:
  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck on application code
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   --error-exitcode=1 \
                   -I app/battery -I app/led -I hal \
                   app/ hal/ platform/

  # ============================================================================
  # Job 2: 多平台构建与测试矩阵
  # ============================================================================
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: static-analysis
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            generator: "Unix Makefiles"
          - os: macos-latest
            cc: clang
            generator: "Unix Makefiles"
          - os: windows-latest
            cc: msvc
            generator: "Ninja"

    runs-on: ${{ matrix.os }}

    steps:
      # ------------------------------------------------------------------
      # 1. 检出代码
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. 安装依赖
      # ------------------------------------------------------------------
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cmake ruby

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ruby

      - name: Setup Ruby (Windows)
        if: matrix.os == 'windows-latest'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # ------------------------------------------------------------------
      # 2.5 设置 MSVC 开发环境（仅 Windows）
      #    GitHub Actions 的 windows-latest runner 上 Visual Studio 2022
      #    生成器可能不可用（"could not find any instance of Visual Studio"）。
      #    使用 Ninja + MSVC 编译器是 Windows 上最可靠的 C/C++ 构建方式。
      #    ilammy/msvc-dev-cmd 会运行 vcvarsall.bat 设置 INCLUDE/LIB/PATH 等
      #    环境变量，使 Ninja 能找到 cl.exe 编译器。
      # ------------------------------------------------------------------
      - name: Setup MSVC environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # ------------------------------------------------------------------
      # 3. 打印工具版本
      #    指定 shell: bash，确保 Windows（PowerShell）也能识别
      #    Unix 语法（&&、2>/dev/null、uname）。GitHub Actions 的
      #    Windows runner 预装 Git Bash，可直接使用 bash。
      # ------------------------------------------------------------------
      - name: Show tool versions
        shell: bash
        run: |
          echo "=== OS ===" && uname -a 2>/dev/null || ver
          echo "=== cmake ===" && cmake --version
          echo "=== ruby ===" && ruby --version

      # ------------------------------------------------------------------
      # 4. CMock 重新生成桩（验证桩生成流程可用）
      # ------------------------------------------------------------------
      - name: Regenerate mocks with CMock
        run: ruby tools/gen_mocks.rb

      # ------------------------------------------------------------------
      # 5. Makefile 构建（仅 Ubuntu/macOS，Windows 无 MinGW make）
      # ------------------------------------------------------------------
      - name: Build with Makefile
        if: matrix.os != 'windows-latest'
        run: make all

      - name: Run unit tests (Makefile)
        if: matrix.os != 'windows-latest'
        run: ./unit_test

      - name: Run firmware demo (Makefile)
        if: matrix.os != 'windows-latest'
        run: ./firmware_demo

      # ------------------------------------------------------------------
      # 6. CMake 构建（全平台）
      # ------------------------------------------------------------------
      - name: Build with CMake
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}"
          cmake --build build --config Release

      - name: Run unit tests (CTest)
        run: |
          cd build
          ctest --output-on-failure -C Release

      # ------------------------------------------------------------------
      # 7. 上传构建产物
      # ------------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            unit_test
            unit_test.exe
            firmware_demo
            firmware_demo.exe
            build/unit_test
            build/unit_test.exe
            build/firmware_demo
            build/firmware_demo.exe
            build/Release/unit_test.exe
            build/Release/firmware_demo.exe
          if-no-files-found: ignore

  # ============================================================================
  # Job 3: 测试覆盖率（仅 Ubuntu，gcov/lcov 最成熟）
  # ============================================================================
  coverage:
    name: Test Coverage (gcov/lcov)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make ruby lcov

      - name: Regenerate mocks
        run: ruby tools/gen_mocks.rb

      - name: Build with coverage flags
        run: |
          make clean
          make all CFLAGS="-Wall -Wextra -std=c99 --coverage -O0 -g"

      - name: Run unit tests
        run: ./unit_test

      - name: Generate coverage report
        run: |
          lcov --capture --directory . --output-file coverage.info \
               --rc branch_coverage=1
          lcov --remove coverage.info \
               '/usr/*' 'framework/*' 'test/*' 'tools/*' \
               --output-file coverage-filtered.info \
               --rc branch_coverage=1 \
               --ignore-errors unused
          genhtml coverage-filtered.info \
                  --output-directory coverage-report \
                  --branch-coverage --legend --title "Unit Test Coverage"

      - name: Print coverage summary
        run: |
          lcov --summary coverage-filtered.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
