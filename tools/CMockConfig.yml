# ==============================================================================
# CMock 桩生成器配置文件
# ==============================================================================
# 本文件由 gen_mocks.rb 读取，控制 CMock 如何从 hal_adc.h 生成桩函数。
#
# 修改本文件后，需重新运行 `ruby gen_mocks.rb` 才能生效。
#
# 关键配置项：
#   :mock_path          生成的桩文件输出目录（设为 "." 输出到当前目录）
#   :mock_prefix        生成的桩文件名/函数前缀（设为 "mock_" 后，
#                       hal_adc.h → mock_hal_adc.c/h，初始化函数 mock_hal_adc_Init）
#   :plugins            启用的插件列表：
#                         :expect        —— 提供 _ExpectAndReturn()，预设调用顺序与返回值
#                         :ignore        —— 提供 _IgnoreAndReturn()，忽略调用次数
#   :when_no_prototypes 当头文件中没有函数原型时的行为（:warn / :error / :ignore）
#   :enforce_strict_ordering  是否强制校验函数调用顺序（true/false）
#   :includes           生成的桩文件中额外包含的头文件（:unity 表示包含 unity.h）
# ==============================================================================

:cmock:
  # 桩文件输出目录（相对于运行脚本时的工作目录，即工程根目录）
  # 产品级架构中桩文件统一放在 test/mocks/ 下，与测试代码同层
  :mock_path: "test/mocks"

  # 桩文件前缀：hal_adc.h → mock_hal_adc.c/h
  :mock_prefix: mock_

  # 启用的插件（决定生成哪些桩函数 API）
  :plugins:
    - :expect           # ExpectAndReturn
    - :ignore           # IgnoreAndReturn / StopIgnore

  # 头文件无函数原型时的行为
  :when_no_prototypes: :warn

  # 不强制严格调用顺序（按函数各自独立计数）
  :enforce_strict_ordering: false

  # 注意：CMock 会自动在生成的桩中包含 unity.h，
  # 不需要在此处显式配置 :includes。若配置 :includes: [:unity]，
  # CMock 会错误地生成 #include "unity"（缺少 .h 后缀）导致编译失败。
